on:
  push:
    branches: main
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
  pull_request:
    branches: main
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
  workflow_dispatch:

name: Test R helpers

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Run testthat suite
        run: Rscript tests/testthat.R
