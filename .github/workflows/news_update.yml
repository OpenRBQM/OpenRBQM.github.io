on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC
  workflow_dispatch:

name: Check for new package releases

jobs:
  update_news:
    if: startsWith(github.repository, 'OpenRBQM/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Check for new releases and update news.qmd
        id: update
        run: |
          added=$(Rscript -e "
            source('R/news.R')
            n <- update_news('news.qmd')
            cat(n)
          ")
          echo "added=$added" >> $GITHUB_OUTPUT
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR if news.qmd changed
        if: steps.update.outputs.added != '0'
        run: |
          branch="auto/news-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add news.qmd
          git commit -m "chore: add ${{ steps.update.outputs.added }} new release(s) to News tab"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update News tab with new package releases" \
            --body "Automated update: ${{ steps.update.outputs.added }} new release(s) added to \`news.qmd\` by the release-check workflow." \
            --assignee nandriychuk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
