on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of each month, 08:00 UTC
  workflow_dispatch:

name: Check for new package releases

jobs:
  update_news:
    if: startsWith(github.repository, 'OpenRBQM/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Check for new releases and update news.qmd
        id: update
        run: |
          added=$(Rscript -e "
            source('R/news.R')
            n <- update_news('news.qmd')
            cat(n)
          ")
          echo "added=$added" >> $GITHUB_OUTPUT
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.CI_GH_APP_ID }}
          private_key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      - name: Open PR if news.qmd changed
        if: steps.update.outputs.added != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            news.qmd
          branch: auto/news-update
          branch-suffix: timestamp
          commit-message: 'chore: add ${{ steps.update.outputs.added }} new release(s) to News tab'
          title: 'chore: update News tab with new package releases'
          body: 'Automated update: ${{ steps.update.outputs.added }} new release(s) added to `news.qmd` by the release-check workflow.'
          assignees: nandriychuk
          delete-branch: true
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
