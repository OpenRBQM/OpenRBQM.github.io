on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '_freeze/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run: deploy or cleanup"
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - cleanup
      pr-number:
        description: "PR number to clean up (only used when mode is cleanup)"
        type: string

name: Render and deploy site

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Production deploy (push to main or manual deploy) ──────────────────────
  deploy:
    if: >-
      startsWith(github.repository, 'OpenRBQM/') && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render & Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Authenticate the R GitHub API calls so any cache miss re-renders at
          # the 5,000/hr rate limit instead of the 60/hr anonymous limit.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

  # ── PR preview deploy (PR open / sync / reopen) ────────────────────────────
  pr-preview:
    if: >-
      startsWith(github.repository, 'OpenRBQM/') &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render site
        run: quarto render
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview to gh-pages subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          clean: false

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://openrbqm.github.io/pr-preview/pr-${prNumber}/`;
            const marker = '<!-- quarto-preview -->';
            const body = `${marker}\n:rocket: **Preview deployed:** ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ── PR preview cleanup (PR closed / merged) ────────────────────────────────
  pr-cleanup:
    if: >-
      startsWith(github.repository, 'OpenRBQM/') && (
        (github.event_name == 'pull_request' && github.event.action == 'closed' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'cleanup')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Delete preview folder
        run: |
          PR="${{ github.event.pull_request.number || inputs['pr-number'] }}"
          if [ -d "pr-preview/pr-${PR}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr-preview/pr-${PR}"
            git commit -m "chore: remove PR ${PR} preview"
            git push
          else
            echo "No preview folder found for PR ${PR}, nothing to clean up."
          fi