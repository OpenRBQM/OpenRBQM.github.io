on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

name: Refresh package data cache

# Re-fetches packages/vignettes/examples from GitHub, refreshes the committed
# _freeze cache for the dynamic pages, and deploys. This is what keeps the
# "dynamic" content current in production without hitting the API on every build.
#
# NOTE: we publish to gh-pages *directly here* because a push made with the
# default GITHUB_TOKEN does not trigger other workflows.
jobs:
  refresh:
    if: startsWith(github.repository, 'OpenRBQM/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up DESCRIPTION dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Stash and clear the dynamic-page cache
        run: |
          cp -r _freeze _freeze.bak 2>/dev/null || true
          rm -rf _freeze/packages _freeze/vignettes

      - name: Render & Publish
        id: render
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore cache on render failure
        if: failure()
        run: |
          rm -rf _freeze/packages _freeze/vignettes
          cp -r _freeze.bak/packages _freeze/ 2>/dev/null || true
          cp -r _freeze.bak/vignettes _freeze/ 2>/dev/null || true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_GH_APP_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      - name: Open PR with refreshed cache
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            _freeze
          branch: auto/refresh-cache
          branch-suffix: timestamp
          commit-message: 'chore: refresh package/vignette data cache'
          title: 'chore: refresh package/vignette data cache'
          body: 'Automated update: refreshed committed `_freeze` cache for dynamic package/vignette pages.'
          assignees: nandriychuk
          delete-branch: true
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
